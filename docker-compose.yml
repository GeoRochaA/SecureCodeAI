services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - AI_PROVIDER=ollama
      - AI_MODEL=qwen2.5-coder:0.5b
      # host-gateway resolve para o IP do host no Linux — Ollama roda lá
      - AI_BASE_URL=http://host-gateway:11434
      - AI_REQUEST_TIMEOUT_MS=300000
      - AI_MAX_TOKENS=550
      - DATABASE_PATH=/app/data/securecode.db
      - CORS_ORIGIN=http://localhost:5173
    extra_hosts:
      - "host-gateway:host-gateway"
    depends_on: []
    volumes:
      - ./backend/data:/app/data
    networks:
      - securecode-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - securecode-network

networks:
  securecode-network:
    driver: bridge
