services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/securecode.db
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - ./backend/data:/app/data
    networks:
      - securecode-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    networks:
      - securecode-network

networks:
  securecode-network:
    driver: bridge
